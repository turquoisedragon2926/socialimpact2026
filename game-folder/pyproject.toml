[project]
name = "common-ground"
version = "0.1.0"
description = "An evidence-grounded community land planning sandbox"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "rasterio>=1.4,<2",
    "numpy>=2,<3",
    "shapely>=2,<3",
    "pyproj>=3.6,<4",
    "httpx>=0.28,<1",
    "deepagents>=0.7,<1",
    "langchain-google-genai>=4,<5",
    "tifffile>=2026.3.3",
    "pyarrow>=26.0.0",
    "imagecodecs>=2026.3.6",
]

[dependency-groups]
dev = ["pytest>=8,<10", "playwright>=1.50,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
